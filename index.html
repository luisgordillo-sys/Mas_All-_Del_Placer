<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Más Allá Del Placer - Catálogo</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    :root { --primary: #e91e63; --bg: #121212; --card-bg: #1e1e1e; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: #fff; margin: 0; padding: 20px; }
    header { text-align: center; margin-bottom: 30px; }
    h1 { color: var(--primary); margin-bottom: 5px; }
    .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto; }
    .product-card { background: var(--card-bg); border-radius: 10px; overflow: hidden; border: 1px solid #333; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
    .product-card img { width: 100%; height: 250px; object-fit: cover; border-radius: 8px; background-color: #2a2a2a; }
    .product-title { font-size: 1.1rem; font-weight: bold; margin: 12px 0 5px; color: #fff; }
    .product-code { color: var(--primary); font-size: 0.85rem; font-weight: bold; margin-bottom: 10px; }
    .product-desc { font-size: 0.9rem; color: #ccc; margin-bottom: 15px; flex-grow: 1; text-align: left; line-height: 1.4; }
    .btn-ws { display: block; background-color: #25d366; color: white; text-decoration: none; padding: 12px; border-radius: 6px; font-weight: bold; text-align: center; }
    .btn-ws:hover { background-color: #1ebd56; }
    .empty-msg { text-align: center; color: #888; grid-column: 1 / -1; padding: 40px; }
  </style>
</head>
<body>

  <header>
    <h1>Más Allá Del Placer</h1>
    <p>Catálogo Oficial de Disfraces y Juguetería</p>
  </header>

  <div class="catalog-grid" id="catalog">
    <div class="empty-msg">Cargando productos...</div>
  </div>

  <script>
    const WHATSAPP_NUMBER = "573194622371";

    // Función principal para cargar productos desde la API de GitHub
    async function loadCatalog() {
      const catalog = document.getElementById('catalog');
      try {
        const repo = "luisgordillo-sys/Mas_All_-Del_Placer";
        const response = await fetch(`https://api.github.com/repos/${repo}/contents/content/productos`);
        
        if (!response.ok) {
          throw new Error("No se pudo obtener el listado desde GitHub API.");
        }

        const files = await response.json();
        catalog.innerHTML = "";

        for (const file of files) {
          if (file.name.endsWith('.md')) {
            const rawRes = await fetch(file.download_url);
            const content = await rawRes.text();

            parseAndRenderProduct(content, catalog);
          }
        }
      } catch (e) {
        console.warn("Fallo lectura dinámica API. Intentando método alternativo por archivos locales...", e);
        fallbackLocalLoad();
      }
    }

    // Método alternativo si la API de GitHub llega a ser bloqueada
    async function fallbackLocalLoad() {
      const catalog = document.getElementById('catalog');
      const knownFiles = [
        "disfraz-de-ratona-sensual.md",
        "lencería-de-enfermera-disfraz-erotic-enfermera.md"
      ];
      
      catalog.innerHTML = "";
      let count = 0;

      for (const fileName of knownFiles) {
        try {
          const res = await fetch(`/content/productos/${fileName}`);
          if (res.ok) {
            const content = await res.text();
            parseAndRenderProduct(content, catalog);
            count++;
          }
        } catch (err) {}
      }

      if (count === 0) {
        catalog.innerHTML = `<div class="empty-msg">No se pudieron cargar los productos. Por favor recarga la página.</div>`;
      }
    }

    function parseAndRenderProduct(content, container) {
      const titleMatch = content.match(/title:\s*"?([^"\n]+)"?/);
      const codeMatch = content.match(/code:\s*"?([^"\n]+)"?/);
      const imageMatch = content.match(/image:\s*"?([^"\n]+)"?/);

      const title = titleMatch ? titleMatch[1] : 'Producto';
      const code = codeMatch ? codeMatch[1] : 'N/A';
      const image = imageMatch ? imageMatch[1] : '';

      const bodyParts = content.split('---');
      const body = bodyParts.length > 2 ? bodyParts.slice(2).join('---').replace(/"/g, '').trim() : '';

      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <div>
          ${image ? `<img src="${image}" alt="${title}">` : ''}
          <div class="product-title">${title}</div>
          <div class="product-code">CÓDIGO: ${code}</div>
          <div class="product-desc">${body}</div>
        </div>
        <a class="btn-ws" href="https://wa.me/${WHATSAPP_NUMBER}?text=Hola,%20quiero%20consultar%20por%20el%20producto:%20${encodeURIComponent(title)}%20(Código:%20${encodeURIComponent(code)})" target="_blank">Pedir por WhatsApp</a>
      `;
      container.appendChild(card);
    }

    loadCatalog();
  </script>

</body>
</html>
