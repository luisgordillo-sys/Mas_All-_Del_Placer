<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Más Allá Del Placer - Catálogo</title>
  <!-- Widget para gestionar contraseña y usuarios -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
    h1 { color: #e91e63; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; max-width: 1000px; margin: 20px auto; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #333; }
  </style>
</head>
<body>
  <h1>Más Allá Del Placer</h1>
  <p>Catálogo Oficial</p>
  <div class="grid">
    <div class="card">
      <h3>Disfraz DS005</h3>
      <p>Línea A&B</p>
    </div>
    <div class="card">
      <h3>Disfraz DS007</h3>
      <p>Línea A&B</p>
    </div>
  </div>

  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
